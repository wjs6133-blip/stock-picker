<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>눌림목 AI 종목 추천</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0d1117;
    color: #e6edf3;
    font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: #161b22;
    border-bottom: 1px solid #30363d;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-icon {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, #238636, #2ea043);
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .logo h1 { font-size: 16px; font-weight: 700; }
  .logo p  { font-size: 12px; color: #7d8590; margin-top: 2px; }
  .header-date { font-size: 12px; color: #7d8590; }

  /* ── 히어로 ── */
  .hero {
    padding: 44px 20px 32px;
    text-align: center;
  }
  .hero h2 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
  .hero p  { font-size: 14px; color: #7d8590; margin-bottom: 28px; line-height: 1.65; }

  #mainBtn {
    background: linear-gradient(135deg, #238636, #2ea043);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 17px 52px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity .2s, transform .1s;
    letter-spacing: -0.3px;
  }
  #mainBtn:hover  { opacity: .88; }
  #mainBtn:active { transform: scale(.97); }

  .last-update {
    margin-top: 12px;
    font-size: 12px;
    color: #484f58;
  }

  /* ── 로딩 ── */
  .loading {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 18px;
    color: #7d8590;
    font-size: 14px;
  }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid #30363d;
    border-top-color: #2ea043;
    border-radius: 50%;
    animation: spin .85s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.3; } }

  /* ── 결과 영역 ── */
  main { max-width: 900px; margin: 0 auto; width: 100%; padding: 0 20px 56px; }

  .section-title {
    font-size: 13px;
    font-weight: 600;
    color: #7d8590;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title::before {
    content: '';
    display: block;
    width: 3px; height: 14px;
    background: #238636;
    border-radius: 2px;
  }

  .cards { display: flex; flex-direction: column; gap: 20px; }

  /* ── 카드 ── */
  .card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 14px;
    overflow: hidden;
    transition: border-color .2s;
  }
  .card:hover { border-color: #388bfd55; }

  .card-header {
    padding: 18px 22px 14px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    border-bottom: 1px solid #21262d;
  }
  .card-meta { display: flex; align-items: center; gap: 10px; }
  .rank {
    width: 30px; height: 30px;
    background: linear-gradient(135deg, #238636, #2ea043);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700;
    flex-shrink: 0;
  }
  .card-name   { font-size: 18px; font-weight: 700; }
  .card-ticker { font-size: 12px; color: #58a6ff; margin-top: 3px; }
  .score-pill {
    background: #1a3c2a;
    border: 1px solid #238636;
    color: #3fb950;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 700;
    white-space: nowrap;
  }

  /* ── 가격 그리드 ── */
  .price-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    background: #21262d;
    gap: 1px;
    border-bottom: 1px solid #21262d;
  }
  .price-cell {
    background: #161b22;
    padding: 13px 16px;
    text-align: center;
  }
  .price-cell .lbl { font-size: 11px; color: #7d8590; margin-bottom: 4px; }
  .price-cell .val { font-size: 16px; font-weight: 700; }
  .p-buy    .val { color: #58a6ff; }
  .p-target .val { color: #3fb950; }
  .p-stop   .val { color: #f85149; }

  /* ── 탭 ── */
  .tabs {
    display: flex;
    border-bottom: 1px solid #21262d;
    background: #0d1117;
  }
  .tab-btn {
    flex: 1;
    background: none;
    border: none;
    color: #7d8590;
    padding: 12px 0;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color .2s, border-color .2s;
    letter-spacing: .2px;
  }
  .tab-btn:hover { color: #c9d1d9; }
  .tab-btn.active { color: #58a6ff; border-bottom-color: #58a6ff; }

  .tab-panel { display: none; padding: 20px 22px; }
  .tab-panel.active { display: block; }

  /* ── 차트 탭 ── */
  .chart-wrap {
    background: #0d1117;
    border-radius: 8px;
    overflow: hidden;
    height: 340px;
    margin-bottom: 14px;
  }
  .chart-legend {
    display: flex;
    gap: 16px;
    font-size: 12px;
    color: #7d8590;
    flex-wrap: wrap;
  }
  .legend-dot {
    display: inline-block;
    width: 10px; height: 3px;
    border-radius: 2px;
    margin-right: 4px;
    vertical-align: middle;
  }

  /* ── 수급 탭 ── */
  .supply-section { margin-bottom: 18px; }
  .supply-label {
    font-size: 12px;
    color: #7d8590;
    margin-bottom: 8px;
    font-weight: 600;
  }
  .supply-total {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 10px;
  }
  .supply-pos { color: #3fb950; }
  .supply-neg { color: #f85149; }
  .supply-neu { color: #7d8590; }

  .bar-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
    font-size: 12px;
  }
  .bar-label { width: 40px; color: #7d8590; text-align: right; flex-shrink: 0; }
  .bar-bg {
    flex: 1;
    height: 18px;
    background: #21262d;
    border-radius: 4px;
    overflow: hidden;
    position: relative;
  }
  .bar-fill {
    height: 100%;
    border-radius: 4px;
    transition: width .4s ease;
    min-width: 2px;
  }
  .bar-fill.pos { background: #238636; }
  .bar-fill.neg { background: #6e1a1a; }
  .bar-val { width: 64px; text-align: right; color: #c9d1d9; flex-shrink: 0; font-weight: 600; }

  /* ── 재료 탭 ── */
  .reason-block {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
  }
  .reason-icon {
    width: 24px; height: 24px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .ri-supply   { background: #1a3c2a; color: #3fb950; }
  .ri-catalyst { background: #1c2a3a; color: #58a6ff; }

  .reason-text { font-size: 13px; line-height: 1.6; color: #c9d1d9; }
  .reason-lbl  { font-weight: 700; color: #7d8590; margin-right: 4px; }

  .news-list { margin-top: 16px; }
  .news-title { font-size: 12px; color: #7d8590; font-weight: 600; margin-bottom: 8px; }
  .news-item {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 8px 0;
    border-bottom: 1px solid #21262d;
    font-size: 13px;
    line-height: 1.5;
  }
  .news-item:last-child { border-bottom: none; }
  .news-dot { color: #30363d; margin-top: 4px; flex-shrink: 0; }

  /* ── 빈 상태 / 에러 ── */
  .empty {
    text-align: center;
    padding: 56px 20px;
    color: #7d8590;
  }
  .empty .ei { font-size: 44px; margin-bottom: 14px; }
  .empty h3  { font-size: 17px; color: #c9d1d9; margin-bottom: 8px; }
  .empty p   { font-size: 13px; line-height: 1.65; }

  .no-data-msg {
    text-align: center;
    padding: 36px 20px;
    font-size: 13px;
    color: #484f58;
  }

  footer {
    margin-top: auto;
    text-align: center;
    padding: 22px 20px;
    font-size: 12px;
    color: #484f58;
    border-top: 1px solid #21262d;
  }

  @media (max-width: 520px) {
    .price-grid { grid-template-columns: 1fr; }
    .card-header { flex-direction: column; }
    #mainBtn { width: 100%; padding: 17px; }
    .chart-wrap { height: 240px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">📈</div>
    <div>
      <h1>눌림목 AI 종목 추천</h1>
      <p>수급 · 재료 · 차트 3중 검증 · 2주 +5% 목표</p>
    </div>
  </div>
  <div class="header-date" id="headerDate"></div>
</header>

<div class="hero">
  <h2>오늘의 매수 후보를 AI가 골라드립니다</h2>
  <p>매일 새벽 전 종목 스캔 → 눌림목 필터 → Gemini AI 심사<br>버튼 클릭 한 번으로 결과를 확인하세요</p>
  <button id="mainBtn" onclick="loadRecs()">🔍 추천 종목 확인하기</button>
  <button id="realtimeBtn" onclick="startRealtime()" style="margin-top:12px;background:transparent;color:#58a6ff;border:1px solid #58a6ff;border-radius:12px;padding:12px 36px;font-size:15px;font-weight:600;cursor:pointer;letter-spacing:-0.3px;transition:all .2s;">⚡ 실시간 종목 분석</button>
  <div class="last-update" id="lastUpdate"></div>
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <span>데이터 불러오는 중…</span>
  </div>
  <div id="realtimeStatus" style="display:none;margin-top:20px;padding:20px;background:#161b22;border:1px solid #30363d;border-radius:12px;max-width:400px;margin-left:auto;margin-right:auto;text-align:left">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <span style="font-size:14px;font-weight:700;color:#58a6ff">⚡ 실시간 분석 진행 중</span>
      <span id="rtTimer" style="font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;color:#c9d1d9">0:00</span>
    </div>
    <div id="rtStages" style="display:flex;flex-direction:column;gap:8px;font-size:13px"></div>
    <div style="margin-top:12px;font-size:12px;color:#484f58">전종목 스캔 후 AI 심사까지 약 8~10분 소요됩니다</div>
  </div>
</div>

<main id="result"></main>

<footer>
  ⚠️ 본 서비스는 참고용 알고리즘 분석이며, 투자 손실에 대한 책임을 지지 않습니다. 최종 판단은 본인이 직접 하세요.
</footer>

<script>
document.getElementById("headerDate").textContent =
  new Date().toLocaleDateString("ko-KR", { year:"numeric", month:"long", day:"numeric", weekday:"short" });

function fmt(n) { return Number(n).toLocaleString("ko-KR"); }

// ── 탭 전환 ──────────────────────────────────────────────────
function switchTab(cardIdx, tab) {
  const card = document.querySelector(`[data-card="${cardIdx}"]`);
  card.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  card.querySelectorAll(".tab-panel").forEach(p => p.classList.toggle("active", p.dataset.panel === tab));

  if (tab === "chart") {
    // DOM 레이아웃 확정 후 렌더 (display:none→block 직후 offsetWidth=0 방지)
    requestAnimationFrame(() => requestAnimationFrame(() => renderChart(cardIdx)));
  }
}

// ── 차트 렌더 ─────────────────────────────────────────────────
const chartInstances = {};

function renderChart(cardIdx) {
  const container = document.getElementById(`chart-${cardIdx}`);
  if (!container) return;

  // 이미 그려진 경우: 크기만 맞춰줌
  if (chartInstances[cardIdx]) {
    const w = container.offsetWidth || container.parentElement?.offsetWidth || 600;
    if (w > 0) {
      chartInstances[cardIdx].applyOptions({ width: w });
      chartInstances[cardIdx].timeScale().fitContent();
    }
    return;
  }

  const raw = window._chartData[cardIdx];
  if (!raw || raw.length === 0) {
    container.innerHTML = '<div class="no-data-msg">차트 데이터가 없습니다</div>';
    return;
  }

  const w = container.offsetWidth || container.parentElement?.offsetWidth || 600;
  const h = 340;
  if (w === 0) {
    // 아직 레이아웃 미확정 — 한 프레임 더 기다림
    requestAnimationFrame(() => renderChart(cardIdx));
    return;
  }

  const chart = LightweightCharts.createChart(container, {
    layout: { background: { color: "#0d1117" }, textColor: "#7d8590" },
    grid: { vertLines: { color: "#21262d" }, horzLines: { color: "#21262d" } },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    rightPriceScale: { borderColor: "#30363d" },
    timeScale: { borderColor: "#30363d", timeVisible: true },
    width: w,
    height: h,
  });

  const candle = chart.addCandlestickSeries({
    upColor: "#ef5350",
    downColor: "#1976d2",
    borderUpColor: "#ef5350",
    borderDownColor: "#1976d2",
    wickUpColor: "#ef5350",
    wickDownColor: "#1976d2",
  });
  candle.setData(raw.map(d => ({ time: d.time, open: d.open, high: d.high, low: d.low, close: d.close })));

  const ma20s = chart.addLineSeries({ color: "#f0a400", lineWidth: 1.5, priceLineVisible: false, lastValueVisible: false });
  ma20s.setData(raw.filter(d => d.ma20 != null).map(d => ({ time: d.time, value: d.ma20 })));

  const ma60s = chart.addLineSeries({ color: "#58a6ff", lineWidth: 1.5, priceLineVisible: false, lastValueVisible: false });
  ma60s.setData(raw.filter(d => d.ma60 != null).map(d => ({ time: d.time, value: d.ma60 })));

  // 거래량 히스토그램 (하단 20% 영역)
  const volSeries = chart.addHistogramSeries({
    priceFormat: { type: "volume" },
    priceScaleId: "volume",
    lastValueVisible: false,
    priceLineVisible: false,
  });
  chart.priceScale("volume").applyOptions({
    scaleMargins: { top: 0.82, bottom: 0 },
  });
  volSeries.setData(raw.map((d, i) => ({
    time: d.time,
    value: d.volume,
    color: i > 0 && d.close >= raw[i - 1].close ? "#ef535055" : "#1976d255",
  })));

  chart.timeScale().fitContent();
  chartInstances[cardIdx] = chart;

  const ro = new ResizeObserver(() => {
    const cw = container.clientWidth;
    if (cw > 0) chart.applyOptions({ width: cw });
  });
  ro.observe(container);
}

// ── 수급 바 HTML ──────────────────────────────────────────────
function buildSupplyHtml(sd) {
  if (!sd) return '<div class="no-data-msg">수급 데이터 없음</div>';

  const net3d = sd.foreign_net_3d ?? 0;
  const daily = sd.foreign_daily ?? [];

  const cls   = net3d > 0 ? "supply-pos" : net3d < 0 ? "supply-neg" : "supply-neu";
  const sign  = net3d > 0 ? "+" : "";

  const maxAbs = Math.max(...daily.map(v => Math.abs(v)), 1);

  const bars = daily.map((v, i) => {
    const pct  = Math.round(Math.abs(v) / maxAbs * 100);
    const cls2 = v >= 0 ? "pos" : "neg";
    const label = `D-${i + 1}`;
    const valStr = (v > 0 ? "+" : "") + fmt(v) + "주";
    return `
      <div class="bar-row">
        <div class="bar-label">${label}</div>
        <div class="bar-bg">
          <div class="bar-fill ${cls2}" style="width:${pct}%"></div>
        </div>
        <div class="bar-val ${v >= 0 ? "supply-pos" : "supply-neg"}">${valStr}</div>
      </div>`;
  }).join("");

  return `
    <div class="supply-section">
      <div class="supply-label">외국인 3일 순매수</div>
      <div class="supply-total ${cls}">${sign}${fmt(net3d)}주</div>
      ${bars || '<div class="no-data-msg" style="padding:8px 0">일별 데이터 없음</div>'}
    </div>`;
}

// ── 재료 탭 HTML ──────────────────────────────────────────────
function buildCatalystHtml(r) {
  const d = r.catalyst_detail || {};
  const news = (r.news || []).map(n => `
    <div class="news-item">
      <span class="news-dot">▪</span>
      <span>${n}</span>
    </div>`).join("");

  const stars = r.catalyst_stars || 0;
  const starHtml = `<span style="letter-spacing:1px">${'★'.repeat(stars)}${'☆'.repeat(5-stars)}</span>`;
  const starColor = stars >= 4 ? '#f0a400' : stars === 3 ? '#c9d1d9' : '#484f58';

  const summaryBlock = r.catalyst_summary ? `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:10px 14px;background:#161b22;border-radius:8px;border:1px solid #30363d">
      <div style="font-size:20px;color:${starColor}">${starHtml}</div>
      <div style="font-size:12px;color:${starColor};font-weight:700">${['','약함','다소 약함','보통','유효','강력'][stars] || ''}</div>
    </div>
    <div class="reason-block">
      <div class="reason-icon ri-catalyst" style="font-size:13px">핵</div>
      <div class="reason-text"><span class="reason-lbl">핵심 근거:</span>${r.catalyst_summary}</div>
    </div>` : "";

  const themeBlock = d.theme ? `
    <div class="reason-block">
      <div class="reason-icon ri-catalyst" style="background:#1c2a3a;color:#58a6ff">테</div>
      <div class="reason-text"><span class="reason-lbl">테마·섹터:</span>${d.theme}</div>
    </div>` : "";

  const momentumBlock = d.momentum ? `
    <div class="reason-block">
      <div class="reason-icon ri-catalyst" style="background:#1a3a2a;color:#3fb950">모</div>
      <div class="reason-text"><span class="reason-lbl">모멘텀:</span>${d.momentum}</div>
    </div>` : "";

  const chartBlock = r.chart_reason ? `
    <div class="reason-block">
      <div class="reason-icon ri-catalyst" style="background:#2a2a1a;color:#f0a400">차</div>
      <div class="reason-text"><span class="reason-lbl">차트 근거:</span>${r.chart_reason}</div>
    </div>` : "";

  const riskBlock = d.risk ? `
    <div class="reason-block">
      <div class="reason-icon" style="background:#3a1a1a;color:#f85149;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;margin-top:1px">위</div>
      <div class="reason-text"><span class="reason-lbl" style="color:#f85149">리스크:</span>${d.risk}</div>
    </div>` : "";

  const strategyBlock = r.entry_plan?.strategy ? `
    <div class="reason-block">
      <div class="reason-icon" style="background:#1a1a3a;color:#9e6fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;margin-top:1px">전</div>
      <div class="reason-text"><span class="reason-lbl">전략:</span>${r.entry_plan.strategy}</div>
    </div>` : "";

  return summaryBlock + themeBlock + momentumBlock + chartBlock + riskBlock + strategyBlock +
    (news ? `<div class="news-list" style="margin-top:16px"><div class="news-title">최근 뉴스 헤드라인</div>${news}</div>` : "");
}

// ── 카드 렌더 ─────────────────────────────────────────────────
function buildCard(r, i) {
  const p = r.entry_plan || {};
  return `
  <div class="card" data-card="${i}">
    <div class="card-header">
      <div class="card-meta">
        <div class="rank">${i + 1}</div>
        <div>
          <div class="card-name">${r.name || r.ticker}</div>
          <div class="card-ticker">${r.ticker}</div>
        </div>
      </div>
      <div class="score-pill" style="${r.score < 90 ? 'background:#2a1f1a;border-color:#8b4513;color:#d4845a' : ''}">AI 점수 ${r.score}점${r.score < 90 ? ' ⚠️' : ''}</div>
    </div>

    <div class="price-grid">
      <div class="price-cell p-buy">
        <div class="lbl">▶ 매수가</div>
        <div class="val">${fmt(p.buy_price)}원</div>
      </div>
      <div class="price-cell p-target">
        <div class="lbl">🎯 목표 +5%</div>
        <div class="val">${fmt(p.target_price)}원</div>
      </div>
      <div class="price-cell p-stop">
        <div class="lbl">🛑 손절 -2.5%</div>
        <div class="val">${fmt(p.stop_loss)}원</div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="chart" onclick="switchTab(${i}, 'chart')">📊 차트</button>
      <button class="tab-btn"        data-tab="catalyst" onclick="switchTab(${i}, 'catalyst')">📰 재료·뉴스</button>
    </div>

    <div class="tab-panel active" data-panel="chart">
      <div class="chart-wrap" id="chart-${i}"></div>
      <div class="chart-legend">
        <span><span class="legend-dot" style="background:#ef5350"></span>상승</span>
        <span><span class="legend-dot" style="background:#1976d2"></span>하락</span>
        <span><span class="legend-dot" style="background:#f0a400"></span>MA20</span>
        <span><span class="legend-dot" style="background:#58a6ff"></span>MA60</span>
      </div>
    </div>

    <div class="tab-panel" data-panel="catalyst">
      ${buildCatalystHtml(r)}
    </div>
  </div>`;
}

// ── 메인 로드 ─────────────────────────────────────────────────
window._chartData = {};

async function loadRecs() {
  const btn     = document.getElementById("mainBtn");
  const loading = document.getElementById("loading");
  const result  = document.getElementById("result");

  btn.style.display  = "none";
  loading.style.display = "flex";
  result.innerHTML   = "";

  try {
    const res  = await fetch("data/recommendations.json?t=" + Date.now());
    if (!res.ok) throw new Error("데이터 파일을 찾을 수 없습니다 (GitHub Actions가 아직 실행되지 않았을 수 있습니다)");
    const data = await res.json();

    document.getElementById("lastUpdate").textContent =
      data.updated_at ? `기준: ${data.updated_at} · 후보 ${data.candidates_count ?? "-"}개 중 ${(data.recommendations||[]).length}개 통과` : "";

    const recs = data.recommendations || [];

    if (recs.length === 0) {
      result.innerHTML = `
        <div class="empty">
          <div class="ei">🔍</div>
          <h3>오늘은 조건을 충족하는 종목이 없습니다</h3>
          <p>${data.message || "눌림목 + 수급 + 재료 3중 검증 기준 90점 초과 종목 없음"}<br>억지 추천보다 오늘은 쉬는 게 맞습니다.</p>
        </div>`;
      return;
    }

    // 차트 데이터 전역 보관
    recs.forEach((r, i) => { window._chartData[i] = r.chart_data || []; });

    const html = recs.map((r, i) => buildCard(r, i)).join("");
    result.innerHTML = `
      <div class="section-title">오늘의 AI 추천 종목 — ${data.date || ""}</div>
      <div class="cards">${html}</div>`;

    // 첫 번째 카드 차트 자동 렌더
    requestAnimationFrame(() => requestAnimationFrame(() => recs.forEach((_, i) => renderChart(i))));

  } catch(e) {
    result.innerHTML = `
      <div class="empty">
        <div class="ei">⚠️</div>
        <h3>데이터를 불러오지 못했습니다</h3>
        <p>${e.message}</p>
      </div>`;
  } finally {
    btn.style.display  = "inline-block";
    loading.style.display = "none";
  }
}

// ── 실시간 분석 ───────────────────────────────────────────────
let rtInterval = null;

const STAGES = [
  { label: "분석 시작",        sec: 0  },
  { label: "전종목 스캔 중",   sec: 30 },
  { label: "수급·뉴스 수집",   sec: 300 },
  { label: "AI(Gemini) 심사",  sec: 420 },
  { label: "결과 저장 중",     sec: 500 },
];

function renderStages(elapsed, done) {
  const el = document.getElementById("rtStages");
  el.innerHTML = STAGES.map(s => {
    const active  = !done && elapsed >= s.sec && elapsed < (STAGES[STAGES.indexOf(s)+1]?.sec ?? Infinity);
    const passed  = done || elapsed > s.sec;
    const color   = done ? "#3fb950" : active ? "#58a6ff" : passed ? "#3fb950" : "#484f58";
    const icon    = done ? "✓" : active ? "▶" : passed ? "✓" : "○";
    return `<div style="display:flex;align-items:center;gap:8px;color:${color}">
      <span style="font-size:11px;width:14px;text-align:center">${icon}</span>
      <span>${s.label}</span>
      ${active ? '<span style="animation:pulse 1s infinite;font-size:11px">···</span>' : ""}
    </div>`;
  }).join("");
}

async function startRealtime() {
  const btn = document.getElementById("realtimeBtn");
  const statusBox = document.getElementById("realtimeStatus");
  const timerEl  = document.getElementById("rtTimer");

  btn.disabled = true;
  btn.style.opacity = "0.5";
  statusBox.style.display = "block";

  // 현재 updated_at 기록
  let prevUpdated = "";
  try {
    const r = await fetch("data/recommendations.json?t=" + Date.now());
    const d = await r.json();
    prevUpdated = d.updated_at || "";
  } catch(_) {}

  // 트리거
  try {
    await fetch("/api/trigger");
  } catch(e) {
    statusBox.innerHTML = `<span style="color:#f85149">트리거 실패: ${e.message}</span>`;
    btn.disabled = false; btn.style.opacity = "1";
    return;
  }

  let elapsed = 0;
  renderStages(elapsed, false);

  if (rtInterval) clearInterval(rtInterval);
  rtInterval = setInterval(async () => {
    elapsed++;
    const m = Math.floor(elapsed / 60);
    const s = String(elapsed % 60).padStart(2, "0");
    timerEl.textContent = `${m}:${s}`;
    renderStages(elapsed, false);

    // 30초마다 완료 여부 확인
    if (elapsed % 30 === 0) {
      try {
        const r = await fetch("data/recommendations.json?t=" + Date.now());
        const d = await r.json();
        if (d.updated_at && d.updated_at !== prevUpdated) {
          clearInterval(rtInterval);
          renderStages(elapsed, true);
          timerEl.textContent = `${m}:${s} ✓`;
          setTimeout(() => {
            statusBox.style.display = "none";
            btn.disabled = false; btn.style.opacity = "1";
            loadRecs();
          }, 1500);
        }
      } catch(_) {}
    }
  }, 1000);
}
</script>
