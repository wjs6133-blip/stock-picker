name: Monthly Index Beater Scanner

on:
  schedule:
    - cron: '0 0 1 * *'   # 매달 1일 00:00 UTC (한국 09:00)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run index beater scanner
        run: python scripts/scan_index_beater.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/index_beater.json
          git diff --staged --quiet || git commit -m "chore: monthly index-beater scan" && git push
